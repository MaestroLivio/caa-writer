<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 10) rotate(0 21 3.5)" opacity="1"><rect x="0" y="0" width="42" height="7" rx="2" fill="#0f766e"/><text x="21" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">STORIA</text></g><g transform="translate(10 18) rotate(0 95 6)" opacity="1"><text x="1.2" y="8.6" text-anchor="start" font-size="7.4" fill="#1f2937" font-family="Arial" font-weight="700">Nota per l&apos;adulto</text></g><g transform="translate(10 38) rotate(0 95 40)" opacity="1"><rect x="0" y="0" width="190" height="80" rx="2.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.5"/><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">Leggere una frase alla volta, lasciare spazio alle domande e verificare che la</text><text x="1.2" y="10.775999" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">storia sia comprensibile. Non presentare il testo come una prescrizione: la</text><text x="1.2" y="16.151999" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">persona può avere reazioni diverse. Se la storia non aiuta, provare una sequenza</text><text x="1.2" y="21.527998" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">visiva o una conversazione con un adulto.</text></g><g transform="translate(10 38) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.1000004" text-anchor="start" font-size="3.9" fill="#475569" font-family="Arial">Leggi la storia insieme e soffermati sulle emozioni e sulle scelte.</text></g><g transform="translate(10 281) rotate(0 94 2)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · materiale modificabile</text></g></svg>