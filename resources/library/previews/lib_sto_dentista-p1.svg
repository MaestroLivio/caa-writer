<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 12 3.5)" opacity="1"><rect x="0" y="0" width="24" height="7" rx="2" fill="#0f766e"/><text x="12" y="4.2" text-anchor="middle" font-size="3" fill="#ffffff" font-family="Arial" font-weight="700">STORIA</text></g><g transform="translate(10 24) rotate(0 95 16)" opacity="1"><text x="1.2" y="10.2" text-anchor="start" font-size="9" fill="#1f2937" font-family="Arial" font-weight="700">La visita dal dentista</text></g><g transform="translate(10 70) rotate(0 95 25)" opacity="1"><rect x="0" y="0" width="190" height="50" rx="2.5" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.4"/><text x="1.2" y="5.6000004" text-anchor="start" font-size="4.4" fill="#1f2937" font-family="Arial">Storia sociale sulla visita dal dentista. Storia in 7 frasi brevi, da leggere</text><text x="1.2" y="11.232" text-anchor="start" font-size="4.4" fill="#1f2937" font-family="Arial">una alla volta, senza giudizi e senza emozioni attribuite.</text></g><g transform="translate(10 150) rotate(0 95 20)" opacity="1"><text x="1.2" y="4.7" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">Storia descrittiva e di anticipazione. Non è una Social Story certificata secondo i criteri 10.4:</text><text x="1.2" y="9.18" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">la revisione dell&apos;adulto è necessaria. Adattare le frasi alla persona.</text></g></svg>