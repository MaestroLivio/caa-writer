<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 17 3.5)" opacity="1"><rect x="0" y="0" width="34" height="7" rx="2" fill="#0f766e"/><text x="17" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">ITALIANO</text></g><g transform="translate(10 17) rotate(0 95 6)" opacity="1"><text x="1.2" y="9.096001" text-anchor="start" font-size="8.6" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni per il docente</text></g><g transform="translate(10 30) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#475569" font-family="Arial">Scheda «Leggo e comprendo»</text></g><g transform="translate(10 284) rotate(0 95 2.5)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · pagina 2 di 2</text></g><g transform="translate(10 44) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.440001" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">1. Nuvola</text></g><g transform="translate(10 62) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.440001" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">2. Sul divano</text></g><g transform="translate(10 80) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.440001" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">3. Dà da mangiare al gatto</text></g><g transform="translate(10 98) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.440001" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">4. Rosso</text></g><g transform="translate(10 116) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.440001" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">5. Nuvola aspetta Lina alla porta.</text></g><g transform="translate(10 134) rotate(0 95 7)" opacity="1"><text x="1.2" y="5.88" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">6. Perché il gomitolo è finito sotto il tavolo e Lina vuole aiutare il gatto a</text><text x="1.2" y="11" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial">trovarlo.</text></g><g transform="translate(10 160) rotate(0 95 14)" opacity="1"><text x="1.2" y="4.8" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">Obiettivo: comprendere un testo narrativo breve, individuare informazioni esplicite e inferire</text><text x="1.2" y="9.408" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">un motivo. Per la risposta 6 accettare formulazioni equivalenti. Errori comuni: confondere il</text><text x="1.2" y="14.016" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">nome del gatto con il colore del gomitolo.</text></g></svg>