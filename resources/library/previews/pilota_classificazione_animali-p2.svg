<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 17 3.5)" opacity="1"><rect x="0" y="0" width="34" height="7" rx="2" fill="#0f766e"/><text x="17" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">SCIENZE</text></g><g transform="translate(10 17) rotate(0 95 6)" opacity="1"><text x="1.2" y="9.096001" text-anchor="start" font-size="8.6" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni e note per il docente</text></g><g transform="translate(10 30) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#475569" font-family="Arial">Scheda «Classifica gli animali»</text></g><g transform="translate(10 284) rotate(0 95 2.5)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · pagina 2 di 2</text></g><g transform="translate(10 48) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.728001" text-anchor="start" font-size="4.8" fill="#1f2937" font-family="Arial" font-weight="700">Mammiferi: cane, gatto, cavallo.</text></g><g transform="translate(10 66) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.728001" text-anchor="start" font-size="4.8" fill="#1f2937" font-family="Arial" font-weight="700">Uccelli: rondine, gufo, pinguino.</text></g><g transform="translate(10 84) rotate(0 95 7)" opacity="1"><text x="1.2" y="8.728001" text-anchor="start" font-size="4.8" fill="#1f2937" font-family="Arial" font-weight="700">Pesci: squalo, trota, pesce.</text></g><g transform="translate(10 112) rotate(0 95 21)" opacity="1"><text x="1.2" y="4.8" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">Obiettivo: classificare gli animali in base a caratteristiche osservabili. Errori comuni:</text><text x="1.2" y="9.408" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">collocare il pinguino tra i pesci perché nuota, o lo squalo tra i mammiferi perché partorisce</text><text x="1.2" y="14.016" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">alcuni piccoli. Il pinguino è un uccello; lo squalo è un pesce. Accettare risposte motivate e</text><text x="1.2" y="18.624" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">verificare insieme le caratteristiche.</text></g><g transform="translate(10 166) rotate(0 95 17)" opacity="1"><rect x="0" y="0" width="190" height="34" rx="2.5" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.4"/><text x="2" y="5.8" text-anchor="start" font-size="3.8" fill="#1f2937" font-family="Arial">Adattamento facilitato: ridurre a sei animali (due per categoria) e fornire le etichette</text><text x="2" y="10.664" text-anchor="start" font-size="3.8" fill="#1f2937" font-family="Arial">da ritagliare. Adattamento avanzato: aggiungere anfibi e rettili e chiedere un criterio</text><text x="2" y="15.528" text-anchor="start" font-size="3.8" fill="#1f2937" font-family="Arial">per ogni gruppo.</text></g></svg>