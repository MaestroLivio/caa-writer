<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 18) rotate(0 95 6)" opacity="1"><text x="1.2" y="8.6" text-anchor="start" font-size="7.4" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni per il docente</text></g><g transform="translate(10 32) rotate(0 95 4)" opacity="1"><text x="1.2" y="5" text-anchor="start" font-size="3.8" fill="#0f766e" font-family="Arial">Risposte, obiettivo e indicazioni per l&apos;adattamento.</text></g><g transform="translate(10 48) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">1 chilogrammo = 1000 grammi</text></g><g transform="translate(106 48) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">mezzo chilo = 500 grammi</text></g><g transform="translate(10 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">1 etto = 100 grammi</text></g><g transform="translate(106 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">1 tonnellata = 1000 chili</text></g><g transform="translate(10 190) rotate(0 95 17)" opacity="1"><text x="1.2" y="4.7" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">Obiettivo: consolidare il calcolo e il ragionamento matematico. Adattamento: ridurre gli</text><text x="1.2" y="9.18" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">esercizi, ingrandire il testo o fornire gettoni e linea dei numeri. Verificare le risposte prima</text><text x="1.2" y="13.66" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">della stampa.</text></g></svg>