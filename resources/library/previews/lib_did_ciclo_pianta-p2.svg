<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 10) rotate(0 21 3.5)" opacity="1"><rect x="0" y="0" width="42" height="7" rx="2" fill="#0f766e"/><text x="21" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">DIDATTICA</text></g><g transform="translate(10 18) rotate(0 95 6)" opacity="1"><text x="1.2" y="8.6" text-anchor="start" font-size="7.4" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni e note per il docente</text></g><g transform="translate(10 38) rotate(0 95 20)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">Parole della scheda: seme, germoglio, piantina, foglie, fiore, frutto.</text></g><g transform="translate(10 90) rotate(0 95 17)" opacity="1"><text x="1.2" y="4.7" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">Obiettivo: consolidare lettura, scrittura e uso del lessico. Adattamento: ridurre le parole,</text><text x="1.2" y="9.18" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">aumentare il carattere, fornire la prima lettera o leggere ad alta voce. Accettare risposte</text><text x="1.2" y="13.66" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">corrette anche con grafia non convenzionale.</text></g><g transform="translate(10 38) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.1000004" text-anchor="start" font-size="3.9" fill="#475569" font-family="Arial">Leggi la consegna, svolgi l&apos;esercizio e verifica insieme il risultato.</text></g><g transform="translate(10 281) rotate(0 94 2)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · materiale modificabile</text></g></svg>