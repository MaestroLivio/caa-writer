<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 10) rotate(0 21 3.5)" opacity="1"><rect x="0" y="0" width="42" height="7" rx="2" fill="#0f766e"/><text x="21" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">DIDATTICA</text></g><g transform="translate(10 18) rotate(0 95 6)" opacity="1"><text x="1.2" y="8.6" text-anchor="start" font-size="7.4" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni per il docente</text></g><g transform="translate(10 32) rotate(0 95 4)" opacity="1"><text x="1.2" y="5" text-anchor="start" font-size="3.8" fill="#0f766e" font-family="Arial">Risposte, obiettivo e indicazioni per l&apos;adattamento.</text></g><g transform="translate(10 48) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">11 undici</text></g><g transform="translate(106 48) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">12 dodici</text></g><g transform="translate(10 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">13 tredici</text></g><g transform="translate(106 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">14 quattordici</text></g><g transform="translate(10 80) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">15 quindici</text></g><g transform="translate(106 80) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">16 sedici</text></g><g transform="translate(10 96) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">17 diciassette</text></g><g transform="translate(106 96) rotate(0 44 6)" opacity="1"><text x="1.2" y="5.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">18 diciotto</text></g><g transform="translate(10 190) rotate(0 95 17)" opacity="1"><text x="1.2" y="4.7" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">Obiettivo: consolidare il calcolo e il ragionamento matematico. Adattamento: ridurre gli</text><text x="1.2" y="9.18" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">esercizi, ingrandire il testo o fornire gettoni e linea dei numeri. Verificare le risposte prima</text><text x="1.2" y="13.66" text-anchor="start" font-size="3.5" fill="#475569" font-family="Arial" font-style="italic">della stampa.</text></g><g transform="translate(10 38) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.1000004" text-anchor="start" font-size="3.9" fill="#475569" font-family="Arial">Leggi la consegna, svolgi l&apos;esercizio e verifica insieme il risultato.</text></g><g transform="translate(10 281) rotate(0 94 2)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · materiale modificabile</text></g></svg>