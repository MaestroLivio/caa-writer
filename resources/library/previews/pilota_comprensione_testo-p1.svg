<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 17 3.5)" opacity="1"><rect x="0" y="0" width="34" height="7" rx="2" fill="#0f766e"/><text x="17" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">ITALIANO</text></g><g transform="translate(10 17) rotate(0 95 6)" opacity="1"><text x="1.2" y="9.096001" text-anchor="start" font-size="8.6" fill="#1f2937" font-family="Arial" font-weight="700">Leggo e comprendo</text></g><g transform="translate(10 30) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#475569" font-family="Arial">Classe seconda · Una storia breve e sei domande</text></g><g transform="translate(10 281) rotate(0 94 2)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · pagina 1 di 2</text></g><g transform="translate(10 40) rotate(0 95 4)" opacity="1"><text x="1.2" y="5.5" text-anchor="start" font-size="4.3" fill="#0f766e" font-family="Arial" font-weight="700">Leggi la storia due volte. Poi rispondi con una crocetta o con una frase.</text></g><g transform="translate(10 52) rotate(0 95 22)" opacity="1"><rect x="0" y="0" width="190" height="44" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.5"/><text x="2.2" y="6.3999996" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">Lina ha un gatto che si chiama Nuvola. Nuvola dorme sul divano tutto il giorno.</text><text x="2.2" y="11.775999" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">Quando Lina torna da scuola, Nuvola la aspetta alla porta. Lina gli dà da</text><text x="2.2" y="17.151999" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">mangiare e poi giocano con un gomitolo rosso. Una sera il gomitolo finisce sotto</text><text x="2.2" y="22.527998" text-anchor="start" font-size="4.2" fill="#1f2937" font-family="Arial">il tavolo. Nuvola lo cerca e Lina lo aiuta.</text></g><g transform="translate(10 102) rotate(0 95 4)" opacity="1"><text x="1.2" y="6.3999996" text-anchor="start" font-size="5.2" fill="#0f766e" font-family="Arial" font-weight="700">Rispondi</text></g><g transform="translate(10 114) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial" font-weight="700">1. Come si chiama il gatto?</text></g><g transform="translate(14 122) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Nuvola</text></g></g><g transform="translate(76 122) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Lina</text></g></g><g transform="translate(138 122) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Rosso</text></g></g><g transform="translate(10 139) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial" font-weight="700">2. Dove dorme Nuvola?</text></g><g transform="translate(14 147) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">A scuola</text></g></g><g transform="translate(76 147) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Sul divano</text></g></g><g transform="translate(138 147) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Sotto il tavolo</text></g></g><g transform="translate(10 164) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial" font-weight="700">3. Che cosa fa Lina quando torna da scuola?</text></g><g transform="translate(14 172) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Dà da mangiare al gatto</text></g></g><g transform="translate(76 172) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Va a dormire</text></g></g><g transform="translate(138 172) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Legge un libro</text></g></g><g transform="translate(10 189) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#1f2937" font-family="Arial" font-weight="700">4. Di che colore è il gomitolo?</text></g><g transform="translate(14 197) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Blu</text></g></g><g transform="translate(76 197) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Verde</text></g></g><g transform="translate(138 197) rotate(0 29 4)" opacity="1"><g transform="translate(1.2 1.2)"><rect x="0" y="1" width="3.6" height="3.6" rx="0.7" fill="#ffffff" stroke="#94a3b8" stroke-width="0.45"/><text x="5.3999996" y="4.024" text-anchor="start" font-size="3.4" fill="#1f2937" font-family="Arial">Rosso</text></g></g><g transform="translate(10 218) rotate(0 95 4)" opacity="1"><text x="1.2" y="6.3999996" text-anchor="start" font-size="5.2" fill="#0f766e" font-family="Arial" font-weight="700">Scrivi tu</text></g><g transform="translate(10 230) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5" text-anchor="start" font-size="3.8" fill="#1f2937" font-family="Arial" font-weight="700">5. Che cosa fa Nuvola quando Lina torna da scuola?</text></g><g transform="translate(10 238) rotate(0 95 7)" opacity="1"><g transform="translate(1.2 1.2)"><line x1="0" y1="4.6000004" x2="187.6" y2="4.6000004" stroke="#94a3b8" stroke-width="0.35"/><line x1="0" y1="10.400001" x2="187.6" y2="10.400001" stroke="#94a3b8" stroke-width="0.35"/></g></g><g transform="translate(10 256) rotate(0 95 3.5)" opacity="1"><text x="1.2" y="5" text-anchor="start" font-size="3.8" fill="#1f2937" font-family="Arial" font-weight="700">6. Perché Lina aiuta Nuvola?</text></g><g transform="translate(10 264) rotate(0 95 7)" opacity="1"><g transform="translate(1.2 1.2)"><line x1="0" y1="4.6000004" x2="187.6" y2="4.6000004" stroke="#94a3b8" stroke-width="0.35"/><line x1="0" y1="10.400001" x2="187.6" y2="10.400001" stroke="#94a3b8" stroke-width="0.35"/></g></g></svg>