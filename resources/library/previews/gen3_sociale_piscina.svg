<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 17 3.5)" opacity="1"><rect x="0" y="0" width="34" height="7" rx="2" fill="#0f766e"/><text x="17" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">STORIA</text></g><g transform="translate(10 17) rotate(0 95 6)" opacity="1"><text x="1.2" y="9.096001" text-anchor="start" font-size="8.6" fill="#1f2937" font-family="Arial" font-weight="700">La piscina</text></g><g transform="translate(10 30) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#475569" font-family="Arial">Una storia da leggere insieme, una frase alla volta.</text></g><g transform="translate(10 284) rotate(0 95 2.5)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · pagina 1 di 6</text></g><g transform="translate(20 54) rotate(0 85 35)" opacity="1"><rect x="0" y="0" width="170" height="70" rx="3" fill="#ecfdf5" stroke="#0f766e" stroke-width="0.5"/><text x="85" y="37.232" text-anchor="middle" font-size="6.2" fill="#1f2937" font-family="Arial" font-weight="700">Oggi andrò in piscina.</text></g><g transform="translate(10 160) rotate(0 95 17)" opacity="1"><text x="1.2" y="4.5" text-anchor="start" font-size="3.3" fill="#475569" font-family="Arial" font-style="italic">Storia descrittiva e di anticipazione. Non è una Social Story certificata secondo i criteri 10.4: la</text><text x="1.2" y="8.724" text-anchor="start" font-size="3.3" fill="#475569" font-family="Arial" font-style="italic">revisione dell&apos;adulto è necessaria.</text></g></svg>