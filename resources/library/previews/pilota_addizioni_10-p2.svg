<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect x="0" y="0" width="210" height="297" fill="#ffffff"/><g transform="translate(10 8) rotate(0 17 3.5)" opacity="1"><rect x="0" y="0" width="34" height="7" rx="2" fill="#0f766e"/><text x="17" y="4.616" text-anchor="middle" font-size="3.1" fill="#ffffff" font-family="Arial" font-weight="700">MATEMATICA</text></g><g transform="translate(10 17) rotate(0 95 6)" opacity="1"><text x="1.2" y="9.096001" text-anchor="start" font-size="8.6" fill="#1f2937" font-family="Arial" font-weight="700">Soluzioni per il docente</text></g><g transform="translate(10 30) rotate(0 95 3)" opacity="1"><text x="1.2" y="5.2" text-anchor="start" font-size="4" fill="#475569" font-family="Arial">Scheda «Addizioni entro il 10» · risposte e indicazioni</text></g><g transform="translate(10 281) rotate(0 94 2)" opacity="1"><text x="1.2" y="4" text-anchor="start" font-size="2.8" fill="#475569" font-family="Arial">CAA Writer · CC BY-NC-SA 4.0 · pagina 2 di 2</text></g><g transform="translate(10 40) rotate(0 95 6)" opacity="1"><text x="1.2" y="5.1000004" text-anchor="start" font-size="3.9" fill="#0f766e" font-family="Arial" font-weight="700">Obiettivo: calcolare addizioni entro il 10 con supporto visivo. Errori comuni: contare</text><text x="1.2" y="10.092001" text-anchor="start" font-size="3.9" fill="#0f766e" font-family="Arial" font-weight="700">due volte l&apos;addendo iniziale.</text></g><g transform="translate(10 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">2 + 1 = 3</text></g><g transform="translate(106 64) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">3 + 2 = 5</text></g><g transform="translate(10 80) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">4 + 3 = 7</text></g><g transform="translate(106 80) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">1 + 4 = 5</text></g><g transform="translate(10 96) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">5 + 2 = 7</text></g><g transform="translate(106 96) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">6 + 3 = 9</text></g><g transform="translate(10 112) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">2 + 7 = 9</text></g><g transform="translate(106 112) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">8 + 1 = 9</text></g><g transform="translate(10 128) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">4 + 5 = 9</text></g><g transform="translate(106 128) rotate(0 44 6)" opacity="1"><text x="1.2" y="7.8" text-anchor="start" font-size="5" fill="#1f2937" font-family="Arial" font-weight="700">7 + 2 = 9</text></g><g transform="translate(10 156) rotate(0 95 15)" opacity="1"><text x="1.2" y="4.8" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">Accettare anche risposte corrette con rappresentazioni diverse (dita, gettoni, linea dei</text><text x="1.2" y="9.408" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">numeri). La scheda è modificabile: cambiare gli addendi non altera le soluzioni finché si</text><text x="1.2" y="14.016" text-anchor="start" font-size="3.6" fill="#475569" font-family="Arial" font-style="italic">aggiorna la pagina docente.</text></g></svg>