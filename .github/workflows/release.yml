name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da pubblicare (es. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
          - os: ubuntu-22.04
            python: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze macOS (decodifica AVIF con dav1d)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Dipendenze di sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - uses: actions/cache@v4
        with:
          path: |
            resources/ai
            resources/symbol-packs/arasaac
          key: caa-assets-${{ runner.os }}-native-v2

      - name: Dipendenze frontend
        run: npm ci

      # I test di affinità usano il catalogo ARASAAC completo; il modello
      # serve alla prova live, che altrimenti si dichiara non eseguita.
      # `fetch_llama.py` interroga api.github.com: senza token gli indirizzi
      # condivisi dei runner prendono 403 «rate limit exceeded».
      - name: Asset di test (modello, runtime, catalogo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.python }} scripts/fetch_release_assets.py

      # Il salvataggio automatico di actions/cache avviene solo a job riuscito:
      # senza questo passo ogni tentativo riscaricherebbe runtime e catalogo.
      - name: Salva gli asset in cache anche se i test falliscono
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            resources/ai
            resources/symbol-packs/arasaac
          key: caa-assets-${{ runner.os }}-native-v2

      - name: Controllo tipi e build frontend
        run: npm run build

      - name: Test TypeScript della selezione
        run: npm run test:frontend

      - name: Test Rust
        working-directory: src-tauri
        run: |
          # La cache Cargo conserva path assoluti ai Cellar Homebrew e alla
          # cache ONNX: rigenerare i build script evita riferimenti rimossi.
          cargo clean -p dav1d-sys -p ort-sys
          cargo test --all-targets --features onnx -- --nocapture

      - name: Report semantico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-report-${{ runner.os }}
          path: tests/last_report.json
          if-no-files-found: ignore

  build:
    name: Bundle (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # La release pubblica solo macOS Apple Silicon e Windows x64: le build
        # macOS Intel e Linux non vengono generate.
        include:
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            python: python3
            llama_asset: native
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            python: python
            llama_asset: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Dipendenze macOS (decodifica AVIF con dav1d)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            resources/ai
            resources/symbol-packs/arasaac
          key: caa-assets-${{ runner.os }}-${{ matrix.llama_asset }}-v2

      - run: npm ci

      - name: Asset di release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.llama_asset }}" = "native" ]; then
            ${{ matrix.python }} scripts/fetch_release_assets.py
          else
            ${{ matrix.python }} scripts/fetch_release_assets.py \
              --llama-asset "${{ matrix.llama_asset }}" --force-llama
          fi

      # `linuxdeploy` è distribuito come AppImage: sul runner senza FUSE va
      # eseguito estratto, altrimenti il bundle AppImage fallisce. In più il
      # suo `strip` (binutils 2.35) muore sulle sezioni `.relr.dyn` delle
      # librerie di sistema recenti, e Tauri riporta il guasto come un generico
      # «failed to run linuxdeploy»: `NO_STRIP` salta quel passo. Su Linux la
      # build è verbosa per avere l'output di linuxdeploy nei log di CI.
      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          VERBOSE=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS su Apple Silicon rifiuta un'app con la sola firma del
            # linker («code has no resources but signature indicates they must
            # be present»), che l'utente vede come «CAA Writer è danneggiata».
            # Senza un certificato Developer ID la firma ad-hoc è l'unica
            # possibile, ma rende il bundle coerente: l'app si apre con
            # «Apri comunque».
            #
            # La firma non si delega al bundler: su x86_64 i sidecar
            # `caa-cli` e `caa-mcp` finiscono in `Contents/MacOS` senza firma
            # e `codesign` del bundle fallisce («code object is not signed at
            # all») — pre-firmarli prima del bundle non serve, il bundler li
            # ricopia. Si costruisce quindi la sola `.app` senza identità
            # (il bundler non firma), si firma l'intero bundle con `--deep` e
            # si crea il DMG con `hdiutil`.
            unset APPLE_SIGNING_IDENTITY
            # `beforeBuildCommand` vuoto: il frontend è già costruito qui
            # sopra e non va ricostruito (farebbe ripartire `tauri-build`).
            NO_HOOK='{"build":{"beforeBuildCommand":""}}'
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            BUNDLES_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
            APP="$BUNDLES_DIR/macos/CAA Writer.app"
            npm run build
            npm run tauri -- build $VERBOSE --target "${{ matrix.target }}" \
              --bundles app --features onnx --config "$NO_HOOK"
            bash scripts/sign_macos.sh "$APP"
            # DMG con la stessa struttura del bundler (app + collegamento ad
            # /Applications per il trascinamento).
            STAGE=$(mktemp -d)
            ditto "$APP" "$STAGE/CAA Writer.app"
            ln -s /Applications "$STAGE/Applications"
            mkdir -p "$BUNDLES_DIR/dmg"
            hdiutil create -volname "CAA Writer" -srcfolder "$STAGE" -ov \
              -format UDZO \
              "$BUNDLES_DIR/dmg/CAA-Writer_${VERSION}_${{ matrix.name }}.dmg"
            rm -rf "$STAGE"
          else
            npm run tauri -- build $VERBOSE --target "${{ matrix.target }}" \
              --bundles "${{ matrix.bundles }}" --features onnx
          fi

      # Controllo che il bundle macOS sia firmato in modo coerente, così il
      # DMG scaricato non viene segnalato come danneggiato.
      - name: Verifica della firma del bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/CAA Writer.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "^Identifier=|^Signature=" || true
          ASSESSMENT=$(spctl -a -vvv -t exec "$APP" 2>&1 || true)
          echo "$ASSESSMENT"
          if echo "$ASSESSMENT" | grep -q "code has no resources"; then
            echo "Firma del bundle incoerente: macOS lo mostrerebbe come danneggiato." >&2
            exit 1
          fi

      - name: Raccogli artefatti e checksum
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p artifacts
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE/macos/CAA Writer.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$BUNDLE/macos/CAA Writer.app" \
              "artifacts/CAA-Writer_${VERSION}_${ASSET_NAME}.app.zip"
          fi
          # Nomi stabili degli asset che l'aggiornamento interno cerca per
          # suffisso (`packages::update_asset`): `_macos-arm64.dmg`,
          # `_macos-x64.dmg`, `_windows-x64-setup.exe`. Tauri li produce con il
          # proprio schema (`CAA.Writer_<versione>_aarch64.dmg`), che cambia con
          # la versione del bundler: senza questa copia l'app installata non
          # trova il pacchetto e l'aggiornamento si ferma subito.
          rename_asset() {
            local pattern="$1" name="$2"
            local source
            source=$(find "$BUNDLE" -type f -name "$pattern" -print -quit)
            if [ -z "$source" ]; then
              echo "asset mancante: $pattern" >&2
              exit 1
            fi
            cp "$source" "artifacts/$name"
          }
          case "$ASSET_NAME" in
            macos-arm64) rename_asset '*.dmg' "CAA-Writer_${VERSION}_macos-arm64.dmg" ;;
            macos-x64) rename_asset '*.dmg' "CAA-Writer_${VERSION}_macos-x64.dmg" ;;
            windows-x64) rename_asset '*x64-setup.exe' "CAA-Writer_${VERSION}_windows-x64-setup.exe" ;;
          esac
          # Gli altri bundle (MSI, DEB, RPM, AppImage) restano col nome del
          # bundler: non servono all'aggiornamento interno.
          find "$BUNDLE" -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} artifacts/ \;
          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "nessun artefatto prodotto" >&2
            exit 1
          fi
          ${{ matrix.python }} - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = sorted(p for p in Path("artifacts").iterdir() if p.is_file())
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          target = Path(f"artifacts/SHA256SUMS-{os.environ['ASSET_NAME']}.txt")
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(target.read_text())
          PY

      - name: Carica artefatti
        uses: actions/upload-artifact@v4
        with:
          name: caa-writer-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Pubblica GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo i bundle: senza `pattern` finirebbe nella release anche il report
      # semantico caricato dai job di test.
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: caa-writer-*
          merge-multiple: true

      - name: Verifica tag e versione
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Il tag $TAG non coincide con la versione $VERSION" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: non viene sovrascritta." >&2
            exit 1
          fi

      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat CHANGELOG.md > release-notes.md
          printf '\n' >> release-notes.md
          cat docs/RELEASE_NOTES.md >> release-notes.md
          gh release create "$TAG" release/* \
            --title "CAA Writer $TAG" \
            --notes-file release-notes.md
