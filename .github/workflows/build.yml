name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa dipendenze frontend
        run: npm ci

      - name: Controllo tipi e build frontend
        run: npm run build

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-targets -- --nocapture

      - name: Report semantico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-report-${{ matrix.os }}
          path: tests/last_report.json
          if-no-files-found: ignore

  bundle:
    name: Installer (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri su Linux richiede WebKitGTK 4.1 e le librerie di sistema.
      - name: Dipendenze di sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - run: npm ci

      # Gli artefatti prodotti qui NON sono firmati né notarizzati:
      # servono certificati e credenziali che il repository non contiene.
      - name: Build bundle (non firmato)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Carica artefatti
        uses: actions/upload-artifact@v4
        with:
          name: caa-writer-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn

  # APK Android: copre anche ChromeOS, che esegue app Android (ARC) oppure
  # applicazioni Linux (Crostini). Non esiste un pacchetto "ChromeOS" separato.
  # ATTENZIONE: job mai eseguito; richiede Android SDK/NDK e un progetto
  # `tauri android init` valido.
  android:
    name: APK Android (non firmato)
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Installa NDK
        run: sdkmanager "ndk;27.0.12077973" > /dev/null

      - run: npm ci

      - name: Inizializza il progetto Android
        run: npm run tauri android init

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: caa-writer-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
